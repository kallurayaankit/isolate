[project]
name = "isolate"
version = "0.1.0"
description = "Find tests that only pass because of other tests"
requires-python = ">=3.10"
dependencies = ["pytest", "python-dotenv"]

[project.scripts]
isolate = "isolate.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
